# Suíte de regressão do NotaFácil (plano de testes, seção 3.3.4).
# Roda todos os testes automatizados a cada push e a cada pull request.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar as dependências
        run: pip install -r requirements.txt

      - name: Executar os testes com cobertura
        run: pytest -v --cov=app --cov-report=term-missing
